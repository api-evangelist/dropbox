openapi: 3.2.0
info:
  title: Reference Template API
  version: 1.0.0
servers:
- url: https://api.hellosign.com/v3
  description: https://api.hellosign.com/v3
tags:
- name: Template
paths:
  /template/{template_id}:
    get:
      operationId: template_get
      summary: Get Template
      description: Returns the Template specified by the `template_id` parameter.
      tags:
      - Template
      parameters:
      - name: template_id
        in: path
        description: The id of the Template to retrieve.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
  /template/list:
    get:
      operationId: template_list
      summary: List Templates
      description: 'Returns a list of the Templates that are accessible by you.


        Take a look at our search guide to learn more about querying templates.'
      tags:
      - Template
      parameters:
      - name: account_id
        in: query
        description: Which account to return Templates for. Must be a team member. Use `all` to indicate all team members. Defaults to your account.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Which page number of the Template List to return. Defaults to `1`.
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        description: Number of objects to be returned per page. Must be between `1` and `100`. Default is `20`.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: query
        in: query
        description: String that includes search terms and/or fields to be used to filter the Template objects.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateListResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
  /template/create:
    post:
      operationId: template_create
      summary: Create Template
      description: 'Creates a template that can be used in future signature requests.


        If `client_id` is provided, the template will be created as an embedded template. Embedded templates can be used for embedded signature requests and can be edited later by generating a new `edit_url` with /embedded/edit_url/{template_id}.


        Template creation may complete asynchronously after the initial request is accepted. It is recommended that a callback be implemented to listen for the callback event. A `template_created` event indicates the template is ready to use, while a `template_error` event indicates there was a problem while creating the template. If a callback handler has been configured and the event has not been received within 60 minutes of making the call, check the status of the request in the API dashboard and retry the request if necessary.'
      tags:
      - Template
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateCreateResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreateRequest'
      security:
      - Basic: []
  /template/create_embedded_draft:
    post:
      operationId: template_createEmbeddedDraft
      summary: Create Embedded Template Draft
      description: The first step in an embedded template workflow. Creates a draft template that can then be further set up in the template 'edit' stage.
      tags:
      - Template
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateCreateEmbeddedDraftResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreateEmbeddedDraftRequest'
      security:
      - Basic: []
  /template/delete/{template_id}:
    post:
      operationId: template_delete
      summary: Delete Template
      description: Completely deletes the template specified from the account.
      tags:
      - Template
      parameters:
      - name: template_id
        in: path
        description: The id of the Template to delete.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/template_delete_Response_200'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
  /template/files/{template_id}:
    get:
      operationId: template_files
      summary: Get Template Files
      description: 'Obtain a copy of the current documents specified by the `template_id` parameter. Returns a PDF or ZIP file.


        If the files are currently being prepared, a status code of `409` will be returned instead. In this case please wait for the `template_created` callback event.'
      tags:
      - Template
      parameters:
      - name: template_id
        in: path
        description: The id of the template files to retrieve.
        required: true
        schema:
          type: string
      - name: file_type
        in: query
        description: Set to `pdf` for a single merged document or `zip` for a collection of individual documents.
        required: false
        schema:
          $ref: '#/components/schemas/TemplateFilesTemplateIdGetParametersFileType'
      responses:
        '200':
          description: successful operation
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
  /template/files_as_data_uri/{template_id}:
    get:
      operationId: template_filesAsDataUri
      summary: Get Template Files as Data Uri
      description: 'Obtain a copy of the current documents specified by the `template_id` parameter. Returns a JSON object with a `data_uri` representing the base64 encoded file (PDFs only).


        If the files are currently being prepared, a status code of `409` will be returned instead. In this case please wait for the `template_created` callback event.'
      tags:
      - Template
      parameters:
      - name: template_id
        in: path
        description: The id of the template files to retrieve.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponseDataUri'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
  /template/files_as_file_url/{template_id}:
    get:
      operationId: template_filesAsFileUrl
      summary: Get Template Files as File Url
      description: 'Obtain a copy of the current documents specified by the `template_id` parameter. Returns a JSON object with a url to the file (PDFs only).


        If the files are currently being prepared, a status code of `409` will be returned instead. In this case please wait for the `template_created` callback event.'
      tags:
      - Template
      parameters:
      - name: template_id
        in: path
        description: The id of the template files to retrieve.
        required: true
        schema:
          type: string
      - name: force_download
        in: query
        description: By default when opening the `file_url` a browser will download the PDF and save it locally. When set to `0` the PDF file will be displayed in the browser.
        required: false
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
  /template/update_files/{template_id}:
    post:
      operationId: template_updateFiles
      summary: Update Template Files
      description: 'Overlays a new file with the overlay of an existing template. The new file(s) must:


        1. have the same or higher page count

        2. the same orientation as the file(s) being replaced.


        This will not overwrite or in any way affect the existing template. Both the existing template and new template will be available for use after executing this endpoint. Also note that this will decrement your template quota.


        Overlaying new files is asynchronous and a successful call to this endpoint will return 200 OK response if the request passes initial validation checks.


        It is recommended that a callback be implemented to listen for the callback event. A `template_created` event will be sent when the files are updated or a `template_error` event will be sent if there was a problem while updating the files. If a callback handler has been configured and the event has not been received within 60 minutes of making the call, check the status of the request in the API dashboard and retry the request if necessary.


        If the page orientation or page count is different from the original template document, we will notify you with a `template_error` callback event.'
      tags:
      - Template
      parameters:
      - name: template_id
        in: path
        description: The ID of the template whose files to update.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateUpdateFilesResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateUpdateFilesRequest'
      security:
      - Basic: []
  /template/add_user/{template_id}:
    post:
      operationId: template_addUser
      summary: Add User to Template
      description: Gives the specified Account access to the specified Template. The specified Account must be a part of your Team.
      tags:
      - Template
      parameters:
      - name: template_id
        in: path
        description: The id of the Template to give the Account access to.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateAddUserRequest'
      security:
      - Basic: []
  /template/remove_user/{template_id}:
    post:
      operationId: template_removeUser
      summary: Remove User from Template
      description: Removes the specified Account's access to the specified Template.
      tags:
      - Template
      parameters:
      - name: template_id
        in: path
        description: The id of the Template to remove the Account's access to.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateRemoveUserRequest'
      security:
      - Basic: []
