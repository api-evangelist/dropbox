    UnclaimedDraftCreateRequestType:
      type: string
      enum:
        - send_document
        - request_signature
      description: >-
        The type of unclaimed draft to create. Use `send_document` to create a claimable file, and `request_signature`
        for a claimable signature request. If the type is `request_signature` then signers name and email_address are
        not optional.
      title: UnclaimedDraftCreateRequestType
    UnclaimedDraftCreateRequest:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
            format: binary
          description: |-
            Use `files[]` to indicate the uploaded file(s) to send for signature.

            This endpoint requires either **files** or **file_urls[]**, but not both.
        file_urls:
          type: array
          items:
            type: string
          description: |-
            Use `file_urls[]` to have Dropbox Sign download the file(s) to send for signature.

            This endpoint requires either **files** or **file_urls[]**, but not both.
        allow_decline:
          type: boolean
          default: false
          description: Allows signers to decline to sign a document if `true`. Defaults to `false`.
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/SubAttachment'
          description: A list describing the attachments
        cc_email_addresses:
          type: array
          items:
            type: string
            format: email
          description: The email addresses that should be CCed.
        client_id:
          type: string
          description: >-
            Client id of the app used to create the draft. Used to apply the branding and callback url defined for the
            app.
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/SubCustomField'
          description: >-
            When used together with merge fields, `custom_fields` allows users to add pre-filled data to their signature
            requests.


            Pre-filled data can be used with "send-once" signature requests by adding merge fields with
            `form_fields_per_document` or [Text Tags](https://app.hellosign.com/api/textTagsWalkthrough#TextTagIntro)
            while passing values back with `custom_fields` together in one API call.


            For using pre-filled on repeatable signature requests, merge fields are added to templates in the Dropbox
            Sign UI or by calling
            [/template/create_embedded_draft](/api/reference/operation/templateCreateEmbeddedDraft) and then passing
            `custom_fields` on subsequent signature requests referencing that template.
        field_options:
          $ref: '#/components/schemas/SubFieldOptions'
        form_field_groups:
          type: array
          items:
            $ref: '#/components/schemas/SubFormFieldGroup'
          description: >-
            Group information for fields defined in `form_fields_per_document`. String-indexed JSON array with
            `group_label` and `requirement` keys. `form_fields_per_document` must contain fields referencing a group
            defined in `form_field_groups`.
        form_field_rules:
          type: array
          items:
            $ref: '#/components/schemas/SubFormFieldRule'
          description: Conditional Logic rules for fields defined in `form_fields_per_document`.
        form_fields_per_document:
          type: array
          items:
            $ref: '#/components/schemas/SubFormFieldsPerDocumentBase'
          description: >-
            The fields that should appear on the document, expressed as an array of objects. (For more details you can
            read about it here: [Using Form Fields per Document](/docs/openapi/form-fields-per-document).)


            **NOTE:** Fields like **text**, **dropdown**, **checkbox**, **radio**, and **hyperlink** have additional
            required and optional parameters. Check out the list of [additional
            parameters](/api/reference/constants/#form-fields-per-document) for these field types.


            * Text Field use `SubFormFieldsPerDocumentText`

            * Dropdown Field use `SubFormFieldsPerDocumentDropdown`

            * Hyperlink Field use `SubFormFieldsPerDocumentHyperlink`

            * Checkbox Field use `SubFormFieldsPerDocumentCheckbox`

            * Radio Field use `SubFormFieldsPerDocumentRadio`

            * Signature Field use `SubFormFieldsPerDocumentSignature`

            * Date Signed Field use `SubFormFieldsPerDocumentDateSigned`

            * Initials Field use `SubFormFieldsPerDocumentInitials`

            * Text Merge Field use `SubFormFieldsPerDocumentTextMerge`

            * Checkbox Merge Field use `SubFormFieldsPerDocumentCheckboxMerge`
        hide_text_tags:
          type: boolean
          default: false
          description: >-
            Send with a value of `true` if you wish to enable automatic Text Tag removal. Defaults to `false`. When
            using Text Tags it is preferred that you set this to `false` and hide your tags with white text or something
            similar because the automatic removal system can cause unwanted clipping. See the [Text
            Tags](https://app.hellosign.com/api/textTagsWalkthrough#TextTagIntro) walkthrough for more details.
        message:
          type: string
          maxLength: 5000
          description: The custom message in the email that will be sent to the signers.
        metadata:
          type: object
          additionalProperties:
            description: Any type
          description: >-
            Key-value data that should be attached to the signature request. This metadata is included in all API
            responses and events involving the signature request. For example, use the metadata field to store a
            signer's order number for look up when receiving events for the signature request.


            Each request can include up to 10 metadata keys (or 50 nested metadata keys), with key names up to 40
            characters long and values up to 1000 characters long.
        show_progress_stepper:
          type: boolean
          default: true
          description: >-
            When only one step remains in the signature request process and this parameter is set to `false` then the
            progress stepper will be hidden.
        signers:
          type: array
          items:
            $ref: '#/components/schemas/SubUnclaimedDraftSigner'
          description: Add Signers to your Unclaimed Draft Signature Request.
        signing_options:
          $ref: '#/components/schemas/SubSigningOptions'
        signing_redirect_url:
          type: string
          description: The URL you want signers redirected to after they successfully sign.
        subject:
          type: string
          maxLength: 200
          description: The subject in the email that will be sent to the signers.
        test_mode:
          type: boolean
          default: false
          description: >-
            Whether this is a test, the signature request created from this draft will not be legally binding if set to
            `true`. Defaults to `false`.
        type:
          $ref: '#/components/schemas/UnclaimedDraftCreateRequestType'
          description: >-
            The type of unclaimed draft to create. Use `send_document` to create a claimable file, and
            `request_signature` for a claimable signature request. If the type is `request_signature` then signers name
            and email_address are not optional.
        use_preexisting_fields:
          type: boolean
          default: false
          description: >-
            Set `use_text_tags` to `true` to enable [Text
            Tags](https://app.hellosign.com/api/textTagsWalkthrough#TextTagIntro) parsing in your document (defaults to
            disabled, or `false`). Alternatively, if your PDF contains pre-defined fields, enable the detection of these
            fields by setting the `use_preexisting_fields` to `true` (defaults to disabled, or `false`). Currently we
            only support use of either `use_text_tags` or `use_preexisting_fields` parameter, not both.
        use_text_tags:
          type: boolean
          default: false
          description: >-
            Set `use_text_tags` to `true` to enable [Text
            Tags](https://app.hellosign.com/api/textTagsWalkthrough#TextTagIntro) parsing in your document (defaults to
            disabled, or `false`). Alternatively, if your PDF contains pre-defined fields, enable the detection of these
            fields by setting the `use_preexisting_fields` to `true` (defaults to disabled, or `false`). Currently we
            only support use of either `use_text_tags` or `use_preexisting_fields` parameter, not both.
        ignore_text_tags_extraction_errors:
          type: boolean
          default: false
          description: Sent with a value of `true` to ignore the validation errors from text tags extraction. Defaults to `false`.
        expires_at:
          type:
            - integer
            - 'null'
          description: >-
            When the signature request will expire. Unsigned signatures will be moved to the expired status, and no
            longer signable. See [Signature Request Expiration
            Date](https://developers.hellosign.com/docs/signature-request/expiration/) for details.


            **NOTE:** This does not correspond to the **expires_at** returned in the response.
      required:
        - type
      title: UnclaimedDraftCreateRequest
    UnclaimedDraftResponse:
      type: object
      properties:
        signature_request_id:
          type:
            - string
            - 'null'
          description: The ID of the signature request that is represented by this UnclaimedDraft.
        claim_url:
          type: string
          description: The URL to be used to claim this UnclaimedDraft.
        signing_redirect_url:
          type:
            - string
            - 'null'
          description: The URL you want signers redirected to after they successfully sign.
        requesting_redirect_url:
          type:
            - string
            - 'null'
          description: >-
            The URL you want signers redirected to after they successfully request a signature (Will only be returned in
            the response if it is applicable to the request.).
        expires_at:
          type:
            - integer
            - 'null'
          description: When the link expires.
        test_mode:
          type: boolean
          description: Whether this is a test draft. Signature requests made from test drafts have no legal value.
      description: A group of documents that a user can take ownership of via the claim URL.
      title: UnclaimedDraftResponse
    UnclaimedDraftCreateResponse:
      type: object
      properties:
        unclaimed_draft:
          $ref: '#/components/schemas/UnclaimedDraftResponse'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/WarningResponse'
          description: A list of warnings.
      required:
        - unclaimed_draft
      title: UnclaimedDraftCreateResponse
    UnclaimedDraftCreateEmbeddedRequestType:
      type: string
      enum:
        - send_document
        - request_signature
      default: request_signature
      description: >-
        The type of the draft. By default this is `request_signature`, but you can set it to `send_document` if you want
