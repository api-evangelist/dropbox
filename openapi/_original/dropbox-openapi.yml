          type: boolean
          description: >-
            Returns `true` if _Custom access codes_ is enabled in Admin Console. [Read
            more](https://developers.hellosign.com/docs/sms-tools/walkthrough).
        sms_delivery:
          type: boolean
          description: >-
            Returns `true` if _Text message_ is enabled in Admin Console. [Read
            more](https://developers.hellosign.com/docs/sms-tools/walkthrough).
        sms_authentication:
          type: boolean
          description: >-
            Returns `true` if _Signer authentication_ is enabled in Admin Console. [Read
            more](https://developers.hellosign.com/docs/sms-tools/walkthrough).
      description: Subset of configured settings
      title: AccountResponseSettings
    AccountResponse:
      type: object
      properties:
        account_id:
          type: string
          description: The ID of the Account
        email_address:
          type: string
          description: The email address associated with the Account.
        is_locked:
          type: boolean
          description: Returns `true` if the user has been locked out of their account by a team admin.
        is_paid_hs:
          type: boolean
          description: Returns `true` if the user has a paid Dropbox Sign account.
        is_paid_hf:
          type: boolean
          description: Returns `true` if the user has a paid HelloFax account.
        quotas:
          $ref: '#/components/schemas/AccountResponseQuotas'
        callback_url:
          type:
            - string
            - 'null'
          description: The URL that Dropbox Sign events will `POST` to.
        role_code:
          type:
            - string
            - 'null'
          description: The membership role for the team.
        team_id:
          type:
            - string
            - 'null'
          description: The id of the team account belongs to.
        locale:
          type:
            - string
            - 'null'
          description: >-
            The locale used in this Account. Check out the list of [supported
            locales](/api/reference/constants/#supported-locales) to learn more about the possible values.
        usage:
          $ref: '#/components/schemas/AccountResponseUsage'
        settings:
          $ref: '#/components/schemas/AccountResponseSettings'
      title: AccountResponse
    WarningResponse:
      type: object
      properties:
        warning_msg:
          type: string
          description: Warning message
        warning_name:
          type: string
          description: Warning name
      required:
        - warning_msg
        - warning_name
      description: A list of warnings.
      title: WarningResponse
    AccountGetResponse:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/AccountResponse'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/WarningResponse'
          description: A list of warnings.
      required:
        - account
      title: AccountGetResponse
    ErrorResponseError:
      type: object
      properties:
        error_msg:
          type: string
          description: Message describing an error.
        error_path:
          type: string
          description: Path at which an error occurred.
        error_name:
          type: string
          description: >-
            Name of the error. See the `x-error-codes` catalog in openapi file for a complete list of possible error
            codes with detailed information including HTTP status codes, causes, remediation steps, and retry guidance.
      required:
        - error_msg
        - error_name
      description: Contains information about an error that occurred.
      title: ErrorResponseError
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorResponseError'
      required:
        - error
      title: ErrorResponse
    AccountUpdateRequest:
      type: object
      properties:
        account_id:
          type:
            - string
            - 'null'
          description: The ID of the Account
        callback_url:
          type: string
          description: The URL that Dropbox Sign should POST events to.
        locale:
          type: string
          description: >-
            The locale used in this Account. Check out the list of [supported
            locales](/api/reference/constants/#supported-locales) to learn more about the possible values.
      title: AccountUpdateRequest
    AccountCreateRequest:
      type: object
      properties:
        client_id:
          type: string
          description: |-
            Used when creating a new account with OAuth authorization.

            See [OAuth 2.0 Authorization](https://app.hellosign.com/api/oauthWalkthrough#OAuthAuthorization)
        client_secret:
          type: string
          description: |-
            Used when creating a new account with OAuth authorization.

            See [OAuth 2.0 Authorization](https://app.hellosign.com/api/oauthWalkthrough#OAuthAuthorization)
        email_address:
          type: string
          format: email
          description: The email address which will be associated with the new Account.
        locale:
          type: string
          description: >-
            The locale used in this Account. Check out the list of [supported
            locales](/api/reference/constants/#supported-locales) to learn more about the possible values.
      required:
        - email_address
      title: AccountCreateRequest
    OAuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Number of seconds until the `access_token` expires. Uses epoch time.
        state:
          type:
            - string
            - 'null'
      title: OAuthTokenResponse
    AccountCreateResponse:
      type: object
      properties:
        account:
