    DocumentFieldDetectionRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: |-
            The PDF file to analyze.

            This endpoint requires either `file` or `file_url`, but not both.
        file_url:
          type: string
          format: uri
          description: |-
            The URL of the PDF file to analyze.

            This endpoint requires either `file` or `file_url`, but not both.
        detection_mode:
          type: string
          description: >-
            The field detection method to use. Set to `annotations` to detect PDF form annotations or `text_tags` to
            detect Dropbox Sign text tags.
        page_range:
          type: string
          pattern: ^(?:all|\d+(?:-\d+)?(?:,\d+(?:-\d+)?)*)$
          description: >-
            The zero-based page indexes to analyze. Accepts `all`, individual pages, inclusive ranges, or
            comma-separated combinations, such as `0-2,5,7-9`. Defaults to `all`.
      required:
        - detection_mode
      title: DocumentFieldDetectionRequest
    DocumentFieldDetectionResponseDetectionResult:
      type: object
      properties:
        document_hash:
          type: string
          minLength: 64
          maxLength: 64
          description: The SHA-256 hash of the analyzed document.
        detection_mode:
          type: string
          description: 'The field detection method used to analyze the document: `annotations` or `text_tags`.'
        page_count:
          type: integer
          minimum: 0
          description: The total number of pages in the document.
        pages_analyzed:
          type: string
          description: >-
            The zero-based page indexes analyzed, represented by the requested `page_range`, or `all` when every page
            was analyzed.
        detected_at:
          type: integer
          format: int64
          description: The Unix timestamp when the field detection result was generated.
        form_fields_per_document:
          type: array
          items:
            $ref: '#/components/schemas/SubFormFieldsPerDocumentBase'
          description: >-
            The fields that should appear on the document, expressed as an array of objects. (For more details you can
            read about it here: [Using Form Fields per Document](/docs/openapi/form-fields-per-document).)


            **NOTE:** Fields like **text**, **dropdown**, **checkbox**, **radio**, and **hyperlink** have additional
            required and optional parameters. Check out the list of [additional
            parameters](/api/reference/constants/#form-fields-per-document) for these field types.


            * Text Field use `SubFormFieldsPerDocumentText`

            * Dropdown Field use `SubFormFieldsPerDocumentDropdown`

            * Hyperlink Field use `SubFormFieldsPerDocumentHyperlink`

            * Checkbox Field use `SubFormFieldsPerDocumentCheckbox`

            * Radio Field use `SubFormFieldsPerDocumentRadio`

            * Signature Field use `SubFormFieldsPerDocumentSignature`

            * Date Signed Field use `SubFormFieldsPerDocumentDateSigned`

            * Initials Field use `SubFormFieldsPerDocumentInitials`

            * Text Merge Field use `SubFormFieldsPerDocumentTextMerge`

            * Checkbox Merge Field use `SubFormFieldsPerDocumentCheckboxMerge`
        form_field_groups:
          type: array
          items:
            $ref: '#/components/schemas/SubFormFieldGroup'
          description: >-
            Group information for fields defined in `form_fields_per_document`. String-indexed JSON array with
            `group_label` and `requirement` keys. `form_fields_per_document` must contain fields referencing a group
            defined in `form_field_groups`.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/WarningResponse'
          description: Non-fatal issues encountered during field detection.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorResponseError'
          description: >-
            Errors encountered during field detection. Successfully detected fields may still be included in the
            response.
        suggestions:
          type: array
          items:
            type: string
          description: Suggestions for improving the field detection results.
      required:
        - document_hash
        - detection_mode
        - page_count
        - pages_analyzed
        - detected_at
        - form_fields_per_document
        - form_field_groups
        - warnings
        - errors
        - suggestions
      title: DocumentFieldDetectionResponseDetectionResult
    DocumentFieldDetectionResponse:
      type: object
      properties:
        detection_result:
          $ref: '#/components/schemas/DocumentFieldDetectionResponseDetectionResult'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/WarningResponse'
          description: A list of warnings.
      required:
        - detection_result
      title: DocumentFieldDetectionResponse
