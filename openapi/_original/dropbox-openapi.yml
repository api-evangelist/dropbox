webhooks:
  callbacksAndEvents_accountUpdateEventCallback:
    post:
      operationId: callbacksAndEvents_accountUpdateEventCallback
      summary: Account Callbacks
      description: >-
        This type of callback URL can be set up at the account level (either by setting it through an API request to
        "/v3/account" or on the Account Settings page on hellosign.com).
                  
        All signature request events that involve your account are reported to this URL. This includes events such as
        receiving a signature request, or when a signature request you've sent is signed by someone. Events are reported
        to the account callback URL for either requests originating on hellosign.com, or on a partner site, via an
        embedded flow.


        You can set your account callback by using the [account API call](https://app.hellosign.com/api/account/post) or
        manually on the [settings page](https://app.hellosign.com/home/myAccount#api).
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        description: >-
          **Account Callback Payloads --**
                Events that are reported at the Account level through the the *Account callback URL* defined in your [API settings](https://app.hellosign.com/home/myAccount#api). The *Account callback URL* can also be updated by calling [Update Account](/api/reference/operation/accountUpdate) and passing a `callback_url`.

          > **Delivery format:** This payload is delivered to your callback URL as an HTTP `POST` with `Content-Type:
          multipart/form-data`. The JSON structure documented below is sent as the value of a single form field named
          `json`. The schema below describes that JSON value.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCallbackPayload'
  callbacksAndEvents_apiAppCreateEventCallback:
    post:
      operationId: callbacksAndEvents_apiAppCreateEventCallback
      summary: App Callbacks
      description: >-
        This type of callback URL is set up at the API app level. API apps are used to identify a partner integration
        and configure embedded flows ([embedded signign](https://app.hellosign.com/api/embeddedSigningWalkthrough),
        [embedded requesting](https://app.hellosign.com/api/embeddedRequestingWalkthrough), and [embedded
        templates](https://app.hellosign.com/api/embeddedTemplatesWalkthrough)) and [OAuth
        providers](https://app.hellosign.com/api/oauthWalkthrough)
                
        All events that involve signature requests created by an API app are reported to this URL. The event will
        include a `client_id` field to indicate which app the event is being reported for, which allows multiple API
        apps to share the same callback URL.


        You can manage your apps and their callbacks from the [settings
        page](https://app.hellosign.com/home/myAccount#api).
      responses:
        '200':
          description: Webhook received successfully
      requestBody:
        description: >-
          **API App Callback Payloads --**

          Events that are reported at the API App level through the *Event callback URL* defined in your [API
          settings](https://app.hellosign.com/home/myAccount#api) for a specific app. The *Event callback URL* can also
          be updated by calling [Update API App](/api/reference/operation/apiAppUpdate) and passing a `callback_url`.


          > **Delivery format:** This payload is delivered to your callback URL as an HTTP `POST` with `Content-Type:
          multipart/form-data`. The JSON structure documented below is sent as the value of a single form field named
          `json`. The schema below describes that JSON value.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCallbackPayload'
components:
  schemas:
