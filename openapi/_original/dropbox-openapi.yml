                $ref: '#/components/schemas/TemplateGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - Basic: []
  /template/list:
    get:
      operationId: template_list
      summary: List Templates
      description: |-
        Returns a list of the Templates that are accessible by you.

        Take a look at our [search guide](/api/reference/search/) to learn more about querying templates.
      tags:
        - Template
      parameters:
        - name: account_id
          in: query
          description: >-
            Which account to return Templates for. Must be a team member. Use `all` to indicate all team members.
            Defaults to your account.
