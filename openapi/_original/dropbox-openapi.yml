    SubFormFieldGroup:
      type: object
      properties:
        group_id:
          type: string
          description: ID of group. Use this to reference a specific group from the `group` value in `form_fields_per_document`.
        group_label:
          type: string
          description: Name of the group
        requirement:
          type: string
          description: >-
            Examples: `require_0-1` `require_1` `require_1-ormore`


            - Check out the list of [acceptable `requirement` checkbox type
            values](/api/reference/constants/#checkbox-field-grouping).

            - Check out the list of [acceptable `requirement` radio type
            fields](/api/reference/constants/#radio-field-grouping).

            - Radio groups require **at least** two fields per group.
      required:
        - group_id
        - group_label
        - requirement
      title: SubFormFieldGroup
    SubFormFieldRuleTriggerOperator:
      type: string
      enum:
        - any
        - is
        - match
        - none
        - not
      description: |-
        Different field types allow different `operator` values:
        - Field type of **text**:
          - **is**: exact match
          - **not**: not exact match
          - **match**: regular expression, without /. Example:
            - OK `[a-zA-Z0-9]`
            - Not OK `/[a-zA-Z0-9]/`
        - Field type of **dropdown**:
          - **is**: exact match, single value
          - **not**: not exact match, single value
          - **any**: exact match, array of values.
          - **none**: not exact match, array of values.
        - Field type of **checkbox**:
          - **is**: exact match, single value
          - **not**: not exact match, single value
        - Field type of **radio**:
          - **is**: exact match, single value
          - **not**: not exact match, single value
      title: SubFormFieldRuleTriggerOperator
    SubFormFieldRuleTrigger:
      type: object
      properties:
        id:
          type: string
          description: >-
            Must reference the `api_id` of an existing field defined within `form_fields_per_document`. Trigger and
            action fields and groups must belong to the same signer.
        operator:
          $ref: '#/components/schemas/SubFormFieldRuleTriggerOperator'
          description: |-
            Different field types allow different `operator` values:
            - Field type of **text**:
              - **is**: exact match
              - **not**: not exact match
              - **match**: regular expression, without /. Example:
                - OK `[a-zA-Z0-9]`
                - Not OK `/[a-zA-Z0-9]/`
            - Field type of **dropdown**:
              - **is**: exact match, single value
              - **not**: not exact match, single value
              - **any**: exact match, array of values.
              - **none**: not exact match, array of values.
            - Field type of **checkbox**:
              - **is**: exact match, single value
              - **not**: not exact match, single value
            - Field type of **radio**:
              - **is**: exact match, single value
              - **not**: not exact match, single value
        value:
          type: string
          description: |-
            **value** or **values** is required, but not both.

            The value to match against **operator**.

            - When **operator** is one of the following, **value** must be `String`:
              - `is`
              - `not`
              - `match`

            Otherwise,
            - **checkbox**: When **type** of trigger is **checkbox**, **value** must be `0` or `1`
            - **radio**: When **type** of trigger is **radio**, **value** must be `1`
        values:
          type: array
          items:
            type: string
          description: |-
            **values** or **value** is required, but not both.

            The values to match against **operator** when it is one of the following:

            - `any`
            - `none`
      required:
        - id
        - operator
      title: SubFormFieldRuleTrigger
    SubFormFieldRuleActionType:
      type: string
      enum:
        - change-field-visibility
        - change-group-visibility
      title: SubFormFieldRuleActionType
    SubFormFieldRuleAction:
      type: object
      properties:
        field_id:
          type: string
          description: |-
            **field_id** or **group_id** is required, but not both.

            Must reference the `api_id` of an existing field defined within `form_fields_per_document`.

            Cannot use with `group_id`. Trigger and action fields must belong to the same signer.
        group_id:
          type: string
          description: |-
            **group_id** or **field_id** is required, but not both.

            Must reference the ID of an existing group defined within `form_field_groups`.

            Cannot use with `field_id`. Trigger and action fields and groups must belong to the same signer.
        hidden:
          type: boolean
          description: '`true` to hide the target field when rule is satisfied, otherwise `false`.'
        type:
          $ref: '#/components/schemas/SubFormFieldRuleActionType'
      required:
        - hidden
        - type
      title: SubFormFieldRuleAction
    SubFormFieldRule:
      type: object
      properties:
        id:
          type: string
          description: Must be unique across all defined rules.
        trigger_operator:
          type: string
          default: AND
          description: Currently only `AND` is supported. Support for `OR` is being worked on.
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/SubFormFieldRuleTrigger'
          description: >-
            An array of trigger definitions, the "if this" part of "**if this**, then that". Currently only a single
            trigger per rule is allowed.
        actions:
          type: array
          items:
            $ref: '#/components/schemas/SubFormFieldRuleAction'
          description: >-
            An array of action definitions, the "then that" part of "if this, **then that**". Any number of actions may
            be attached to a single rule.
      required:
        - id
        - trigger_operator
        - triggers
        - actions
      title: SubFormFieldRule
