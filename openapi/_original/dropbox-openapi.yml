        - zip_code
        - social_security_number
        - employer_identification_number
        - custom_regex
      description: >-
        Each text field may contain a `validation_type` parameter. Check out the list of [validation
        types](https://faq.hellosign.com/hc/en-us/articles/217115577) to learn more about the possible values.


        **NOTE:** When using `custom_regex` you are required to pass a second parameter `validation_custom_regex` and
