            fields](https://faq.hellosign.com/hc/en-us/articles/360051467511-Auto-Fill-Fields) can automatically
            populate a signer's information during signing.


            **NOTE:** Keep your signer's information safe by ensuring that the _signer on your signature request is the
            intended party_ before using this feature.
      required:
        - template_ids
        - client_id
        - signers
      title: SignatureRequestEditEmbeddedWithTemplateRequest
    SignatureRequestEditWithTemplateRequest:
      type: object
      properties:
        template_ids:
          type: array
          items:
            type: string
          description: >-
            Use `template_ids` to create a SignatureRequest from one or more templates, in the order in which the
            template will be used.
        allow_decline:
          type: boolean
          default: false
          description: Allows signers to decline to sign a document if `true`. Defaults to `false`.
        ccs:
          type: array
          items:
            $ref: '#/components/schemas/SubCC'
          description: Add CC email recipients. Required when a CC role exists for the Template.
        client_id:
          type: string
          description: >-
            Client id of the app to associate with the signature request. Used to apply the branding and callback url
            defined for the app.
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/SubCustomField'
          description: An array defining values and options for custom fields. Required when a custom field exists in the Template.
        files:
          type: array
          items:
            type: string
            format: binary
          description: |-
            Use `files[]` to indicate the uploaded file(s) to send for signature.

            This endpoint requires either **files** or **file_urls[]**, but not both.
        file_urls:
          type: array
          items:
            type: string
          description: |-
            Use `file_urls[]` to have Dropbox Sign download the file(s) to send for signature.

            This endpoint requires either **files** or **file_urls[]**, but not both.
        is_eid:
          type: boolean
          default: false
          description: >-
            Send with a value of `true` if you wish to enable

            [electronic identification (eID)](https://sign.dropbox.com/features/electronic-id),

            which requires the signer to verify their identity with an eID provider to sign a document.<br>

            **NOTE:** You need the eID add-on to use this feature. Please [contact
            sales](https://sign.dropbox.com/form/contact-sales) for more information. Cannot be used in `test_mode`.
            Only works on requests with one signer.
        message:
          type: string
          maxLength: 5000
          description: The custom message in the email that will be sent to the signers.
        metadata:
          type: object
          additionalProperties:
            description: Any type
          description: >-
            Key-value data that should be attached to the signature request. This metadata is included in all API
            responses and events involving the signature request. For example, use the metadata field to store a
            signer's order number for look up when receiving events for the signature request.


            Each request can include up to 10 metadata keys (or 50 nested metadata keys), with key names up to 40
            characters long and values up to 1000 characters long.
        signers:
          type: array
          items:
            $ref: '#/components/schemas/SubSignatureRequestTemplateSigner'
          description: Add Signers to your Templated-based Signature Request.
        signing_options:
          $ref: '#/components/schemas/SubSigningOptions'
        signing_redirect_url:
          type: string
          description: The URL you want signers redirected to after they successfully sign.
        subject:
          type: string
          maxLength: 255
          description: The subject in the email that will be sent to the signers.
        test_mode:
          type: boolean
          default: false
          description: >-
            Whether this is a test, the signature request will not be legally binding if set to `true`. Defaults to
            `false`.
        title:
          type: string
          maxLength: 255
          description: The title you want to assign to the SignatureRequest.
      required:
        - template_ids
        - signers
      title: SignatureRequestEditWithTemplateRequest
