            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequestEditEmbeddedRequest'
      security:
        - Basic: []
  /signature_request/edit_embedded_with_template/{signature_request_id}:
    put:
      operationId: signatureRequest_editEmbeddedWithTemplate
      summary: Edit Embedded Signature Request with Template
      description: >-
        Edits a SignatureRequest based on the given Template(s) to be signed in an embedded iFrame. Note that embedded
        signature requests can only be signed in embedded iFrames whereas normal signature requests can only be signed
        on Dropbox Sign.


        **NOTE:** Edit and resend *will* deduct your signature request quota.
      tags:
        - signatureRequest
      parameters:
        - name: signature_request_id
          in: path
          description: The id of the SignatureRequest to edit.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequestEditEmbeddedWithTemplateRequest'
      security:
        - Basic: []
  /signature_request/edit_with_template/{signature_request_id}:
    put:
      operationId: signatureRequest_editWithTemplate
      summary: Edit Signature Request With Template
      description: |-
        Edits and sends a SignatureRequest based off of the Template(s) specified with the template_ids parameter.

        **NOTE:** Edit and resend *will* deduct your signature request quota.
      tags:
        - signatureRequest
      parameters:
        - name: signature_request_id
          in: path
          description: The id of the SignatureRequest to edit.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequestEditWithTemplateRequest'
      security:
        - Basic: []
  /template/{template_id}:
    get:
      operationId: template_get
      summary: Get Template
      description: Returns the Template specified by the `template_id` parameter.
      tags:
        - Template
      parameters:
        - name: template_id
          in: path
          description: The id of the Template to retrieve.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
