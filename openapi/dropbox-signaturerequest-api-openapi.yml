openapi: 3.2.0
info:
  title: Reference Signature Request API
  version: 1.0.0
servers:
- url: https://api.hellosign.com/v3
  description: https://api.hellosign.com/v3
tags:
- name: signatureRequest
paths:
  /signature_request/{signature_request_id}:
    get:
      operationId: signatureRequest_get
      summary: Get Signature Request
      description: Returns the status of the SignatureRequest specified by the `signature_request_id` parameter.
      tags:
      - signatureRequest
      parameters:
      - name: signature_request_id
        in: path
        description: The id of the SignatureRequest to retrieve.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
  /signature_request/list:
    get:
      operationId: signatureRequest_list
      summary: List Signature Requests
      description: 'Returns a list of SignatureRequests that you can access. This includes SignatureRequests you have sent as well as received, but not ones that you have been CCed on.


        Take a look at our search guide to learn more about querying signature requests.'
      tags:
      - signatureRequest
      parameters:
      - name: account_id
        in: query
        description: Which account to return SignatureRequests for. Must be a team member. Use `all` to indicate all team members. Defaults to your account.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Which page number of the SignatureRequest List to return. Defaults to `1`.
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        description: Number of objects to be returned per page. Must be between `1` and `100`. Default is `20`.
        required: false
        schema:
          type: integer
          default: 20
      - name: query
        in: query
        description: String that includes search terms and/or fields to be used to filter the SignatureRequest objects.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestListResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
  /signature_request/files/{signature_request_id}:
    get:
      operationId: signatureRequest_files
      summary: Download Files
      description: 'Obtain a copy of the current documents specified by the `signature_request_id` parameter. Returns a PDF or ZIP file.


        If the files are currently being prepared, a status code of `409` will be returned instead.'
      tags:
      - signatureRequest
      parameters:
      - name: signature_request_id
        in: path
        description: The id of the SignatureRequest to retrieve.
        required: true
        schema:
          type: string
      - name: file_type
        in: query
        description: Set to `pdf` for a single merged document or `zip` for a collection of individual documents.
        required: false
        schema:
          $ref: '#/components/schemas/SignatureRequestFilesSignatureRequestIdGetParametersFileType'
          default: pdf
      responses:
        '200':
          description: successful operation
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
  /signature_request/files_as_data_uri/{signature_request_id}:
    get:
      operationId: signatureRequest_filesAsDataUri
      summary: Download Files as Data Uri
      description: 'Obtain a copy of the current documents specified by the `signature_request_id` parameter. Returns a JSON object with a `data_uri` representing the base64 encoded file (PDFs only).


        If the files are currently being prepared, a status code of `409` will be returned instead.'
      tags:
      - signatureRequest
      parameters:
      - name: signature_request_id
        in: path
        description: The id of the SignatureRequest to retrieve.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponseDataUri'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
  /signature_request/files_as_file_url/{signature_request_id}:
    get:
      operationId: signatureRequest_filesAsFileUrl
      summary: Download Files as File Url
      description: 'Obtain a copy of the current documents specified by the `signature_request_id` parameter. Returns a JSON object with a url to the file (PDFs only).


        If the files are currently being prepared, a status code of `409` will be returned instead.'
      tags:
      - signatureRequest
      parameters:
      - name: signature_request_id
        in: path
        description: The id of the SignatureRequest to retrieve.
        required: true
        schema:
          type: string
      - name: force_download
        in: query
        description: By default when opening the `file_url` a browser will download the PDF and save it locally. When set to `0` the PDF file will be displayed in the browser.
        required: false
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
  /signature_request/send:
    post:
      operationId: signatureRequest_send
      summary: Send Signature Request
      description: Creates and sends a new SignatureRequest with the submitted documents. If `form_fields_per_document` is not specified, a signature page will be affixed where all signers will be required to add their signature, signifying their agreement to all contained documents.
      tags:
      - signatureRequest
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequestSendRequest'
      security:
      - Basic: []
  /signature_request/send_with_template:
    post:
      operationId: signatureRequest_sendWithTemplate
      summary: Send with Template
      description: Creates and sends a new SignatureRequest based off of the Template(s) specified with the `template_ids` parameter.
      tags:
      - signatureRequest
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequestSendWithTemplateRequest'
      security:
      - Basic: []
  /signature_request/bulk_send_with_template:
    post:
      operationId: signatureRequest_bulkSendWithTemplate
      summary: Bulk Send with Template
      description: 'Creates BulkSendJob which sends up to 250 SignatureRequests in bulk based off of the provided Template(s) specified with the `template_ids` parameter.


        **NOTE:** Only available for Standard plan and higher.'
      tags:
      - signatureRequest
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkSendJobSendResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequestBulkSendWithTemplateRequest'
      security:
      - Basic: []
  /signature_request/remind/{signature_request_id}:
    post:
      operationId: signatureRequest_remind
      summary: Send Request Reminder
      description: 'Sends an email to the signer reminding them to sign the signature request. You cannot send a reminder within 1 hour of the last reminder that was sent. This includes manual AND automatic reminders.


        **NOTE:** This action can **not** be used with embedded signature requests.'
      tags:
      - signatureRequest
      parameters:
      - name: signature_request_id
        in: path
        description: The id of the SignatureRequest to send a reminder for.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequestRemindRequest'
      security:
      - Basic: []
  /signature_request/release_hold/{signature_request_id}:
    post:
      operationId: signatureRequest_releaseHold
      summary: Release On-Hold Signature Request
      description: Releases a held SignatureRequest that was claimed and prepared from an UnclaimedDraft. The owner of the Draft must indicate at Draft creation that the SignatureRequest created from the Draft should be held. Releasing the SignatureRequest will send requests to all signers.
      tags:
      - signatureRequest
      parameters:
      - name: signature_request_id
        in: path
        description: The id of the SignatureRequest to release.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
  /signature_request/update/{signature_request_id}:
    post:
      operationId: signatureRequest_update
      summary: Update Signature Request
      description: 'Updates the email address and/or the name for a given signer on a signature request. You can listen for the `signature_request_email_bounce` event on your app or account to detect bounced emails, and respond with this method.


        Updating the email address of a signer will generate a new `signature_id` value.


        **NOTE:** This action cannot be performed on a signature request with an appended signature page.'
      tags:
      - signatureRequest
      parameters:
      - name: signature_request_id
        in: path
        description: The id of the SignatureRequest to update.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequestUpdateRequest'
      security:
      - Basic: []
  /signature_request/cancel/{signature_request_id}:
    post:
      operationId: signatureRequest_cancel
      summary: Cancel Incomplete Signature Request
      description: 'Cancels an incomplete signature request. This action is **not reversible**.


        The request will be canceled and signers will no longer be able to sign. If they try to access the signature request they will receive a HTTP 410 status code indicating that the resource has been deleted. Cancelation is asynchronous and a successful call to this endpoint will return an empty 200 OK response if the signature request is eligible to be canceled and has been successfully queued.


        This 200 OK response does not indicate a successful cancelation of the signature request itself. The cancelation is confirmed via the `signature_request_canceled` event. It is recommended that a callback handler be implemented to listen for the `signature_request_canceled` event. This callback will be sent only when the cancelation has completed successfully. If a callback handler has been configured and the event has not been received within 60 minutes of making the call, check the status of the request in the API Dashboard and retry the cancelation if necessary.


        To be eligible for cancelation, a signature request must have been sent successfully, must not yet have been signed by all signers, and you must either be the sender or own the API app under which it was sent. A partially signed signature request can be canceled.


        **NOTE:** To remove your access to a completed signature request, use the endpoint: `POST /signature_request/remove/[:signature_request_id]`.'
      tags:
      - signatureRequest
      parameters:
      - name: signature_request_id
        in: path
        description: The id of the incomplete SignatureRequest to cancel.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/signatureRequest_cancel_Response_200'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
  /signature_request/remove/{signature_request_id}:
    post:
      operationId: signatureRequest_remove
      summary: Remove Signature Request Access
      description: 'Removes your access to a completed signature request. This action is **not reversible**.


        The signature request must be fully executed by all parties (signed or declined to sign). Other parties will continue to maintain access to the completed signature request document(s).


        Unlike /signature_request/cancel, this endpoint is synchronous and your access will be immediately removed. Upon successful removal, this endpoint will return a 200 OK response.'
      tags:
      - signatureRequest
      parameters:
      - name: signature_request_id
        in: path
        description: The id of the SignatureRequest to remove.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/signatureRequest_remove_Response_200'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
  /signature_request/bulk_create_embedded_with_template:
    post:
      operationId: signatureRequest_bulkCreateEmbeddedWithTemplate
      summary: Embedded Bulk Send with Template
      description: 'Creates BulkSendJob which sends up to 250 SignatureRequests in bulk based off of the provided Template(s) specified with the `template_ids` parameter to be signed in an embedded iFrame. These embedded signature requests can only be signed in embedded iFrames whereas normal signature requests can only be signed on Dropbox Sign.


        **NOTE:** Only available for Standard plan and higher.'
      tags:
      - signatureRequest
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkSendJobSendResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequestBulkCreateEmbeddedWithTemplateRequest'
      security:
      - Basic: []
  /signature_request/create_embedded:
    post:
      operationId: signatureRequest_createEmbedded
      summary: Create Embedded Signature Request
      description: Creates a new SignatureRequest with the submitted documents to be signed in an embedded iFrame. If form_fields_per_document is not specified, a signature page will be affixed where all signers will be required to add their signature, signifying their agreement to all contained documents. Note that embedded signature requests can only be signed in embedded iFrames whereas normal signature requests can only be signed on Dropbox Sign.
      tags:
      - signatureRequest
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequestCreateEmbeddedRequest'
      security:
      - Basic: []
  /signature_request/create_embedded_with_template:
    post:
      operationId: signatureRequest_createEmbeddedWithTemplate
      summary: Create Embedded Signature Request with Template
      description: Creates a new SignatureRequest based on the given Template(s) to be signed in an embedded iFrame. Note that embedded signature requests can only be signed in embedded iFrames whereas normal signature requests can only be signed on Dropbox Sign.
      tags:
      - signatureRequest
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequestCreateEmbeddedWithTemplateRequest'
      security:
      - Basic: []
  /signature_request/edit/{signature_request_id}:
    put:
      operationId: signatureRequest_edit
      summary: Edit Signature Request
      description: 'Edits and sends a SignatureRequest with the submitted documents. If `form_fields_per_document` is not specified, a signature page will be affixed where all signers will be required to add their signature, signifying their agreement to all contained documents.


        **NOTE:** Edit and resend *will* deduct your signature request quota.'
      tags:
      - signatureRequest
      parameters:
      - name: signature_request_id
        in: path
        description: The id of the SignatureRequest to edit.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequestEditRequest'
      security:
      - Basic: []
  /signature_request/edit_embedded/{signature_request_id}:
    put:
      operationId: signatureRequest_editEmbedded
      summary: Edit Embedded Signature Request
      description: 'Edits a SignatureRequest with the submitted documents to be signed in an embedded iFrame. If form_fields_per_document is not specified, a signature page will be affixed where all signers will be required to add their signature, signifying their agreement to all contained documents. Note that embedded signature requests can only be signed in embedded iFrames whereas normal signature requests can only be signed on Dropbox Sign.


        **NOTE:** Edit and resend *will* deduct your signature request quota.'
      tags:
      - signatureRequest
      parameters:
      - name: signature_request_id
        in: path
        description: The id of the SignatureRequest to edit.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequestEditEmbeddedRequest'
      security:
      - Basic: []
  /signature_request/edit_embedded_with_template/{signature_request_id}:
    put:
      operationId: signatureRequest_editEmbeddedWithTemplate
      summary: Edit Embedded Signature Request with Template
      description: 'Edits a SignatureRequest based on the given Template(s) to be signed in an embedded iFrame. Note that embedded signature requests can only be signed in embedded iFrames whereas normal signature requests can only be signed on Dropbox Sign.


        **NOTE:** Edit and resend *will* deduct your signature request quota.'
      tags:
      - signatureRequest
      parameters:
      - name: signature_request_id
        in: path
        description: The id of the SignatureRequest to edit.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequestEditEmbeddedWithTemplateRequest'
      security:
      - Basic: []
  /signature_request/edit_with_template/{signature_request_id}:
    put:
      operationId: signatureRequest_editWithTemplate
      summary: Edit Signature Request With Template
      description: 'Edits and sends a SignatureRequest based off of the Template(s) specified with the template_ids parameter.


        **NOTE:** Edit and resend *will* deduct your signature request quota.'
      tags:
      - signatureRequest
      parameters:
      - name: signature_request_id
        in: path
        description: The id of the SignatureRequest to edit.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequestEditWithTemplateRequest'
      security:
      - Basic: []
components:
  schemas:
    SignatureRequestBulkCreateEmbeddedWithTemplateRequest:
      type: object
      properties:
        template_ids:
          type: array
          items:
            type: string
          description: Use `template_ids` to create a SignatureRequest from one or more templates, in the order in which the template will be used.
        signer_file:
          type: string
          format: binary
          description: "`signer_file` is a CSV file defining values and options for signer fields. Required unless a `signer_list` is used, you may not use both. The CSV can have the following columns:\n\n- `name`: the name of the signer filling the role of RoleName\n- `email_address`: email address of the signer filling the role of RoleName\n- `pin`: the 4- to 12-character access code that will secure this signer's signature page (optional)\n- `sms_phone_number`: An E.164 formatted phone number that will receive a code via SMS to access this signer's signature page. (optional)\n\n    By using the feature, you agree you are responsible for obtaining a signer's consent to receive text messages from Dropbox Sign related to this signature request and confirm you have obtained such consent from all signers prior to enabling SMS delivery for this signature request. [Learn more](https://faq.hellosign.com/hc/en-us/articles/15815316468877-Dropbox-Sign-SMS-tools-add-on).\n\n    **NOTE:** Not available in test mode and requires a Standard plan or higher.\n- `*_field`: any column with a _field\" suffix will be treated as a custom field (optional)\n\n    You may only specify field values here, any other options should be set in the custom_fields request parameter.\n\nExample CSV:\n\n```\nname, email_address, pin, company_field\nGeorge, george@example.com, d79a3td, ABC Corp\nMary, mary@example.com, gd9as5b, 123 LLC\n```"
        signer_list:
          type: array
          items:
            $ref: '#/components/schemas/SubBulkSignerList'
          description: '`signer_list` is an array defining values and options for signer fields. Required unless a `signer_file` is used, you may not use both.'
        allow_decline:
          type: boolean
          default: false
          description: Allows signers to decline to sign a document if `true`. Defaults to `false`.
        ccs:
          type: array
          items:
            $ref: '#/components/schemas/SubCC'
          description: Add CC email recipients. Required when a CC role exists for the Template.
        client_id:
          type: string
          description: Client id of the app you're using to create this embedded signature request. Used for security purposes.
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/SubCustomField'
          description: 'When used together with merge fields, `custom_fields` allows users to add pre-filled data to their signature requests.


            Pre-filled data can be used with "send-once" signature requests by adding merge fields with `form_fields_per_document` or [Text Tags](https://app.hellosign.com/api/textTagsWalkthrough#TextTagIntro) while passing values back with `custom_fields` together in one API call.


            For using pre-filled on repeatable signature requests, merge fields are added to templates in the Dropbox Sign UI or by calling [/template/create_embedded_draft](/api/reference/operation/templateCreateEmbeddedDraft) and then passing `custom_fields` on subsequent signature requests referencing that template.'
        message:
          type: string
          maxLength: 5000
          description: The custom message in the email that will be sent to the signers.
        metadata:
          type: object
          additionalProperties:
            description: Any type
          description: 'Key-value data that should be attached to the signature request. This metadata is included in all API responses and events involving the signature request. For example, use the metadata field to store a signer''s order number for look up when receiving events for the signature request.


            Each request can include up to 10 metadata keys (or 50 nested metadata keys), with key names up to 40 characters long and values up to 1000 characters long.'
        signing_redirect_url:
          type: string
          description: The URL you want signers redirected to after they successfully sign.
        subject:
          type: string
          maxLength: 255
          description: The subject in the email that will be sent to the signers.
        test_mode:
          type: boolean
          default: false
          description: Whether this is a test, the signature request will not be legally binding if set to `true`. Defaults to `false`.
        title:
          type: string
          maxLength: 255
          description: The title you want to assign to the SignatureRequest.
        expires_at:
          type:
          - integer
          - 'null'
          description: When the signature request will expire. Unsigned signatures will be moved to the expired status, and no longer signable. See [Signature Request Expiration Date](https://developers.hellosign.com/docs/signature-request/expiration/) for details.
      required:
      - template_ids
      - client_id
      title: SignatureRequestBulkCreateEmbeddedWithTemplateRequest
    SubSigningOptionsDefaultType:
      type: string
      enum:
      - draw
      - phone
      - type
      - upload
      description: The default type shown (limited to the listed types)
      title: SubSigningOptionsDefaultType
    SubSignatureRequestSignerSmsPhoneNumberType:
      type: string
      enum:
      - authentication
      - delivery
      description: 'Specifies the feature used with the `sms_phone_number`. Default `authentication`.


        If `authentication`, signer is sent a verification code via SMS that is required to access the document.


        If `delivery`, a link to complete the signature request is delivered via SMS (_and_ email).'
      title: SubSignatureRequestSignerSmsPhoneNumberType
    SignatureRequestResponse:
      type: object
      properties:
        test_mode:
          type: boolean
