openapi: 3.2.0
info:
  title: Dropbox Team API
  version: '1.0'
  description: 'Operations tagged Team across 3 of this provider''s published API definitions: dropbox-openapi-original.yml, dropbox-openapi.yml, dropbox-team-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.dropbox.com
- url: https://api.hellosign.com/v3
  description: https://api.hellosign.com/v3
tags:
- name: Team
paths:
  /2/team/features/get_values:
    post:
      tags:
      - Team
      summary: Dropbox features/get_values
      description: 'features/get_values


        scope: `team_info.read`


        Get the values for one or more featues. This route allows you to check your account''s capability for what feature you can access or what value you have for certain features.

        Permission : Team information.'
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n    \"features\": [\n        {\n            \".tag\": \"upload_api_rate_limit\"\n        }, \n        {\n            \".tag\": \"has_team_shared_dropbox\"\n        }\n    ]\n}"'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: OK
          headers:
            X-Dropbox-Request-Id:
              schema:
                type: integer
                example: '1234'
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
                values:
                - .tag: upload_api_rate_limit
                  upload_api_rate_limit:
                    .tag: limit
                    limit: 25000
                - .tag: has_team_shared_dropbox
                  has_team_shared_dropbox:
                    .tag: has_team_shared_dropbox
                    has_team_shared_dropbox: false
      security:
      - bearerAuth: []
      operationId: post2TeamFeaturesGetValues
      x-operation-id-source: derived
    servers:
    - url: https://api.dropbox.com
  /2/team/get_info:
    post:
      tags:
      - Team
      summary: Dropbox get_info
      description: 'get_info


        scope: `team_info.read`


        Retrieves information about a team.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          headers:
            X-Dropbox-Request-Id:
              schema:
                type: integer
                example: '1234'
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
                name: Dropbox Inc.
                team_id: dbtid:1234abcd
                num_licensed_users: 5
                num_provisioned_users: 2
                policies:
                  sharing:
                    shared_folder_member_policy:
                      .tag: team
                    shared_folder_join_policy:
                      .tag: from_anyone
                    shared_link_create_policy:
                      .tag: team_only
                  emm_state:
                    .tag: disabled
                  office_addin:
                    .tag: disabled
      operationId: post2TeamGetInfo
      x-operation-id-source: derived
    servers:
    - url: https://api.dropbox.com
  /2/team/token/get_authenticated_admin:
    post:
      tags:
      - Team
      summary: Dropbox token/get_authenticated_admin
      description: 'token/get_authenticated_admin


        scope: `team_info.read`


        Returns the member profile of the admin who generated the team access token used to make the call.'
      responses:
        '200':
          description: OK
          headers:
            X-Dropbox-Request-Id:
              schema:
                type: integer
                example: '1234'
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
                admin_profile:
                  team_member_id: dbmid:FDFSVF-DFSDF
                  email: tami@seagull.com
                  email_verified: false
                  status:
                    .tag: active
                  name:
                    given_name: Franz
                    surname: Ferdinand
                    familiar_name: Franz
                    display_name: Franz Ferdinand (Personal)
                    abbreviated_name: FF
                  membership_type:
                    .tag: full
                  groups:
                  - g:e2db7665347abcd600000000001a2b3c
                  member_folder_id: '20'
                  external_id: '244423'
                  account_id: dbid:AAH4f99T0taONIb-OurWxbNQ6ywGRopQngc
                  secondary_emails:
                  - email: grape@strawberry.com
                    is_verified: false
                  - email: apple@orange.com
                    is_verified: true
                  joined_on: '2015-05-12T15:50:38Z'
                  profile_photo_url: https://dl-web.dropbox.com/account_photo/get/dbaphid%3AAAHWGmIXV3sUuOmBfTz0wPsiqHUpBWvv3ZA?vers=1556069330102&size=128x128
      security:
      - bearerAuth: []
      operationId: post2TeamTokenGetAuthenticatedAdmin
      x-operation-id-source: derived
    servers:
    - url: https://api.dropbox.com
  /team:
    get:
      operationId: team_get
      summary: Get Team
      description: Returns information about your Team as well as a list of its members. If you do not belong to a Team, a 404 error with an error_name of "not_found" will be returned.
      tags:
      - Team
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
    put:
      operationId: team_update
      summary: Update Team
      description: Updates the name of your Team.
      tags:
      - Team
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdateRequest'
      security:
      - Basic: []
    servers:
    - url: https://api.hellosign.com/v3
      description: https://api.hellosign.com/v3
  /team/info:
    get:
      operationId: team_info
      summary: Get Team Info
      description: Provides information about a team.
      tags:
      - Team
      parameters:
      - name: team_id
        in: query
        description: The id of the team.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamGetInfoResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
    servers:
    - url: https://api.hellosign.com/v3
      description: https://api.hellosign.com/v3
  /team/members/{team_id}:
    get:
      operationId: team_members
      summary: List Team Members
      description: Provides a paginated list of members (and their roles) that belong to a given team.
      tags:
      - Team
      parameters:
      - name: team_id
        in: path
        description: The id of the team that a member list is being requested from.
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Which page number of the team member list to return. Defaults to `1`.
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        description: Number of objects to be returned per page. Must be between `1` and `100`. Default is `20`.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMembersResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
    servers:
    - url: https://api.hellosign.com/v3
      description: https://api.hellosign.com/v3
  /team/sub_teams/{team_id}:
    get:
      operationId: team_subTeams
      summary: List Sub Teams
      description: Provides a paginated list of sub teams that belong to a given team.
      tags:
      - Team
      parameters:
      - name: team_id
        in: path
        description: The id of the parent Team.
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Which page number of the SubTeam List to return. Defaults to `1`.
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        description: Number of objects to be returned per page. Must be between `1` and `100`. Default is `20`.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSubTeamsResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
    servers:
    - url: https://api.hellosign.com/v3
      description: https://api.hellosign.com/v3
  /team/create:
    post:
      operationId: team_create
      summary: Create Team
      description: Creates a new Team and makes you a member. You must not currently belong to a Team to invoke.
      tags:
      - Team
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
      security:
      - Basic: []
    servers:
    - url: https://api.hellosign.com/v3
      description: https://api.hellosign.com/v3
  /team/destroy:
    delete:
      operationId: team_delete
      summary: Delete Team
      description: Deletes your Team. Can only be invoked when you have a Team with only one member (yourself).
      tags:
      - Team
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/team_delete_Response_200'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
    servers:
    - url: https://api.hellosign.com/v3
      description: https://api.hellosign.com/v3
  /team/add_member:
    put:
      operationId: team_addMember
      summary: Add User to Team
      description: Invites a user (specified using the `email_address` parameter) to your Team. If the user does not currently have a Dropbox Sign Account, a new one will be created for them. If a user is already a part of another Team, a `team_invite_failed` error will be returned.
      tags:
      - Team
      parameters:
      - name: team_id
        in: query
        description: The id of the team.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamAddMemberRequest'
      security:
      - Basic: []
    servers:
    - url: https://api.hellosign.com/v3
      description: https://api.hellosign.com/v3
  /team/remove_member:
    post:
      operationId: team_removeMember
      summary: Remove User from Team
      description: Removes the provided user Account from your Team. If the Account had an outstanding invitation to your Team, the invitation will be expired. If you choose to transfer documents from the removed Account to an Account provided in the `new_owner_email_address` parameter (available only for Enterprise plans), the response status code will be 201, which indicates that your request has been queued but not fully executed.
      tags:
      - Team
      responses:
        '201':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRemoveMemberRequest'
      security:
      - Basic: []
    servers:
    - url: https://api.hellosign.com/v3
      description: https://api.hellosign.com/v3
  /team/invites:
    servers:
    - url: https://api.hellosign.com/v3
    get:
      tags:
      - Team
      summary: Dropbox _t__TeamInvites::SUMMARY
      description: _t__TeamInvites::DESCRIPTION
      operationId: teamInvites
      parameters:
      - name: email_address
        in: query
        description: _t__TeamInvites::EMAIL_ADDRESS
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-Ratelimit-Reset:
              $ref: '#/components/headers/X-Ratelimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInvitesResponse'
              examples:
                default_example:
                  $ref: '#/components/examples/TeamInvitesResponseExample'
        4XX:
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_2'
              examples:
                400_example:
                  $ref: '#/components/examples/Error400ResponseExample'
                401_example:
                  $ref: '#/components/examples/Error401ResponseExample'
                402_example:
                  $ref: '#/components/examples/Error402ResponseExample'
                403_example:
                  $ref: '#/components/examples/Error403ResponseExample'
                4XX_example:
                  $ref: '#/components/examples/Error4XXResponseExample'
      security:
      - api_key: []
      - oauth2:
        - account_access
        - basic_account_info
      x-codeSamples:
      - lang: PHP
        label: PHP
        source:
          $ref: examples/TeamInvites.php
      - lang: C#
        label: C#
        source:
          $ref: examples/TeamInvites.cs
      - lang: JavaScript
        label: JavaScript
        source:
          $ref: examples/TeamInvites.js
      - lang: TypeScript
        label: TypeScript
        source:
          $ref: examples/TeamInvites.ts
      - lang: Java
        label: Java
        source:
          $ref: examples/TeamInvites.java
      - lang: Ruby
        label: Ruby
        source:
          $ref: examples/TeamInvites.rb
      - lang: Python
        label: Python
        source:
          $ref: examples/TeamInvites.py
      - lang: cURL
        label: cURL
        source:
          $ref: examples/TeamInvites.sh
      x-meta:
        seo:
          title: _t__TeamInvites::SEO::TITLE
          description: _t__TeamInvites::SEO::DESCRIPTION
components:
  schemas:
    TeamMembersResponse:
      type: object
      properties:
        team_members:
          type: array
          items:
            $ref: '#/components/schemas/TeamMemberResponse'
          description: Contains a list of team members and their roles for a specific team.
        list_info:
          $ref: '#/components/schemas/ListInfoResponse'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/WarningResponse'
      required:
      - team_members
      - list_info
      title: TeamMembersResponse
    TeamGetInfoResponse:
      type: object
      properties:
        team:
          $ref: '#/components/schemas/TeamInfoResponse'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/WarningResponse'
          description: A list of warnings.
      required:
      - team
      title: TeamGetInfoResponse
    ErrorResponseError:
      type: object
      properties:
        error_msg:
          type: string
          description: Message describing an error.
        error_path:
          type: string
          description: Path at which an error occurred.
        error_name:
          type: string
          description: Name of the error. See the `x-error-codes` catalog in openapi file for a complete list of possible error codes with detailed information including HTTP status codes, causes, remediation steps, and retry guidance.
      required:
      - error_msg
      - error_name
      description: Contains information about an error that occurred.
      title: ErrorResponseError
    TeamRemoveMemberRequest:
      type: object
      properties:
        account_id:
          type: string
          description: '**account_id** or **email_address** is required. If both are provided, the account id prevails.


            Account id to remove from your Team.'
        email_address:
          type: string
          format: email
          description: '**account_id** or **email_address** is required. If both are provided, the account id prevails.


            Email address of the Account to remove from your Team.'
        new_owner_email_address:
          type: string
          format: email
          description: 'The email address of an Account on this Team to receive all documents, templates, and API apps (if applicable) from the removed Account. If not provided, and on an Enterprise plan, this data will remain with the removed Account.


            **NOTE:** Only available for Enterprise plans.'
        new_team_id:
          type: string
          description: Id of the new Team.
        new_role:
          $ref: '#/components/schemas/TeamRemoveMemberRequestNewRole'
          description: 'A new role member will take in a new Team.


            **NOTE:** This parameter is used only if `new_team_id` is provided.'
      title: TeamRemoveMemberRequest
    TeamInfoResponse:
      type: object
      properties:
        team_id:
          type: string
          description: The id of a team
        team_parent:
          $ref: '#/components/schemas/TeamParentResponse'
        name:
          type: string
          description: The name of a team
        num_members:
          type: integer
          description: Number of members within a team
        num_sub_teams:
          type: integer
          description: Number of sub teams within a team
      title: TeamInfoResponse
    TeamRemoveMemberRequestNewRole:
      type: string
      enum:
      - Member
      - Developer
      - Team Manager
      - Admin
      description: 'A new role member will take in a new Team.


        **NOTE:** This parameter is used only if `new_team_id` is provided.'
      title: TeamRemoveMemberRequestNewRole
    AccountResponseSettings:
      type: object
      properties:
        signer_access_codes:
          type: boolean
          description: Returns `true` if _Custom access codes_ is enabled in Admin Console. [Read more](https://developers.hellosign.com/docs/sms-tools/walkthrough).
        sms_delivery:
          type: boolean
          description: Returns `true` if _Text message_ is enabled in Admin Console. [Read more](https://developers.hellosign.com/docs/sms-tools/walkthrough).
        sms_authentication:
          type: boolean
          description: Returns `true` if _Signer authentication_ is enabled in Admin Console. [Read more](https://developers.hellosign.com/docs/sms-tools/walkthrough).
      description: Subset of configured settings
      title: AccountResponseSettings
    TeamCreateRequest:
      type: object
      properties:
        name:
          type: string
          default: Untitled Team
          description: The name of your Team.
      title: TeamCreateRequest
    team_delete_Response_200:
      type: object
      properties: {}
      description: Empty response body
      title: team_delete_Response_200
    AccountResponse:
      type: object
      properties:
        account_id:
          type: string
          description: The ID of the Account
        email_address:
          type: string
          description: The email address associated with the Account.
        is_locked:
          type: boolean
          description: Returns `true` if the user has been locked out of their account by a team admin.
        is_paid_hs:
          type: boolean
          description: Returns `true` if the user has a paid Dropbox Sign account.
        is_paid_hf:
          type: boolean
          description: Returns `true` if the user has a paid HelloFax account.
        quotas:
          $ref: '#/components/schemas/AccountResponseQuotas'
        callback_url:
          type:
          - string
          - 'null'
          description: The URL that Dropbox Sign events will `POST` to.
        role_code:
          type:
          - string
          - 'null'
          description: The membership role for the team.
        team_id:
          type:
          - string
          - 'null'
          description: The id of the team account belongs to.
        locale:
          type:
          - string
          - 'null'
          description: The locale used in this Account. Check out the list of [supported locales](/api/reference/constants/#supported-locales) to learn more about the possible values.
        usage:
          $ref: '#/components/schemas/AccountResponseUsage'
        settings:
          $ref: '#/components/schemas/AccountResponseSettings'
      title: AccountResponse
    TeamResponse:
      type: object
      properties:
        name:
          type: string
          description: The name of your Team
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountResponse'
        invited_accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountResponse'
          description: A list of all Accounts that have an outstanding invitation to join your Team. Note that this response is a subset of the response parameters found in `GET /account`.
        invited_emails:
          type: array
          items:
            type: string
          description: A list of email addresses that have an outstanding invitation to join your Team and do not yet have a Dropbox Sign account.
      description: Contains information about your team and its members
      title: TeamResponse
    SubTeamResponse:
      type: object
      properties:
        team_id:
          type: string
          description: The id of a team
        name:
          type: string
          description: The name of a team
      title: SubTeamResponse
    AccountResponseUsage:
      type: object
      properties:
        fax_pages_sent:
          type:
          - integer
          - 'null'
          description: Number of fax pages sent
      description: Details concerning monthly usage
      title: AccountResponseUsage
    TeamUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of your Team.
      title: TeamUpdateRequest
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorResponseError'
      required:
      - error
      title: ErrorResponse
    TeamAddMemberRequest:
      type: object
      properties:
        account_id:
          type: string
          description: '`account_id` or `email_address` is required. If both are provided, the account id prevails.


            Account id of the user to invite to your Team.'
        email_address:
          type: string
          format: email
          description: '`account_id` or `email_address` is required, If both are provided, the account id prevails.


            Email address of the user to invite to your Team.'
        role:
          $ref: '#/components/schemas/TeamAddMemberRequestRole'
          description: 'A role member will take in a new Team.


            **NOTE:** This parameter is used only if `team_id` is provided.'
      title: TeamAddMemberRequest
    TeamMemberResponse:
      type: object
      properties:
        account_id:
          type: string
          description: Account id of the team member.
        email_address:
          type: string
          description: Email address of the team member.
        role:
          type: string
          description: The specific role a member has on the team.
      title: TeamMemberResponse
    TeamSubTeamsResponse:
      type: object
      properties:
        sub_teams:
          type: array
          items:
            $ref: '#/components/schemas/SubTeamResponse'
          description: Contains a list with sub teams.
        list_info:
          $ref: '#/components/schemas/ListInfoResponse'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/WarningResponse'
      required:
      - sub_teams
      - list_info
      title: TeamSubTeamsResponse
    WarningResponse:
      type: object
      properties:
        warning_msg:
          type: string
          description: Warning message
        warning_name:
          type: string
          description: Warning name
      required:
      - warning_msg
      - warning_name
      description: A list of warnings.
      title: WarningResponse
    TeamAddMemberRequestRole:
      type: string
      enum:
      - Member
      - Developer
      - Team Manager
      - Admin
      description: 'A role member will take in a new Team.


        **NOTE:** This parameter is used only if `team_id` is provided.'
      title: TeamAddMemberRequestRole
    TeamGetResponse:
      type: object
      properties:
        team:
          $ref: '#/components/schemas/TeamResponse'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/WarningResponse'
          description: A list of warnings.
      required:
      - team
      title: TeamGetResponse
    AccountResponseQuotas:
      type: object
      properties:
        api_signature_requests_left:
          type:
          - integer
          - 'null'
          description: API signature requests remaining.
