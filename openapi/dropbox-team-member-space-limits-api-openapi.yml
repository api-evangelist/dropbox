openapi: 3.2.0
info:
  title: Dropbox API Reference Team > Member_space_limits API
  description: The powerful, yet simple, Dropbox API allows you to manage and control content and team settings programmatically and extend Dropbox capabilities in new and powerful ways.
  version: 1.0.0
servers:
- url: https://api.dropbox.com
security:
- bearerAuth: []
tags:
- name: Team > Member_space_limits
paths:
  /2/team/member_space_limits/excluded_users/add:
    post:
      tags:
      - Team > Member_space_limits
      summary: Dropbox member_space_limits/excluded_users/add
      description: 'member_space_limits/excluded_users/add


        scope: `members.write`


        Add users to member space limits excluded users list.'
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n    \"users\": [\n        {\n            \".tag\": \"team_member_id\", \n            \"team_member_id\": \"dbmid:efgh5678\"\n        }\n    ]\n}"'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: OK
          headers:
            X-Dropbox-Request-Id:
              schema:
                type: integer
                example: '1234'
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
                status:
                  .tag: success
      operationId: post2TeamMemberSpaceLimitsExcludedUsersAdd
      x-operation-id-source: derived
  /2/team/member_space_limits/excluded_users/list:
    post:
      tags:
      - Team > Member_space_limits
      summary: Dropbox member_space_limits/excluded_users/list
      description: 'member_space_limits/excluded_users/list


        scope: `members.read`


        List member space limits excluded users.'
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n    \"limit\": 100\n}"'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: OK
          headers:
            X-Dropbox-Request-Id:
              schema:
                type: integer
                example: '1234'
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
                users: []
                has_more: false
                cursor: ZtkX9_EHj3x7PMkVuFIhwKYXEpwpLwyxp9vMKomUhllil9q7eWiAu
      operationId: post2TeamMemberSpaceLimitsExcludedUsersList
      x-operation-id-source: derived
