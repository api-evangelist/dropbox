                - group_name: Test group
                  group_id: g:e2db7665347abcd600000000001a2b3c
                  group_management_type:
                    .tag: user_managed
                  member_count: 10
                cursor: ZtkX9_EHj3x7PMkVuFIhwKYXEpwpLwyxp9vMKomUhllil9q7eWiAu
