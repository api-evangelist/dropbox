openapi: 3.2.0
info:
  title: Dropbox API Reference Team > Groups API
  description: The powerful, yet simple, Dropbox API allows you to manage and control content and team settings programmatically and extend Dropbox capabilities in new and powerful ways.
  version: 1.0.0
servers:
- url: https://api.dropbox.com
security:
- bearerAuth: []
tags:
- name: Team > Groups
paths:
  /2/team/groups/create:
    post:
      tags:
      - Team > Groups
      summary: Dropbox groups/create
      description: 'groups/create


        scope: `groups.write`


        Creates a new, empty group, with a requested name.

        Permission : Team member management.'
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n    \"group_name\": \"Europe sales\", \n    \"add_creator_as_owner\": false, \n    \"group_external_id\": \"group-134\"\n}"'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: OK
          headers:
            X-Dropbox-Request-Id:
              schema:
                type: integer
                example: '1234'
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
                group_name: project launch
                group_id: g:e2db7665347abcd600000000001a2b3c
                group_management_type:
                  .tag: user_managed
                created: 1447255518000
                member_count: 5
                members:
                - profile:
                    team_member_id: dbmid:1234567
                    email: mary@lamb.com
                    email_verified: true
                    status:
                      .tag: active
                    name:
                      given_name: Franz
                      surname: Ferdinand
                      familiar_name: Franz
                      display_name: Franz Ferdinand (Personal)
                      abbreviated_name: FF
                    membership_type:
                      .tag: full
                    account_id: dbid:AAH4f99T0taONIb-OurWxbNQ6ywGRopQngc
                    secondary_emails:
                    - email: apple@orange.com
                      is_verified: true
                    - email: banana@honeydew.com
                      is_verified: true
                    - email: grape@strawberry.com
                      is_verified: false
                    joined_on: '2015-05-12T15:50:38Z'
                    profile_photo_url: https://dl-web.dropbox.com/account_photo/get/dbaphid%3AAAHWGmIXV3sUuOmBfTz0wPsiqHUpBWvv3ZA?vers=1556069330102&size=128x128
                  access_type:
                    .tag: member
      operationId: post2TeamGroupsCreate
      x-operation-id-source: derived
  /2/team/groups/delete:
    post:
      tags:
      - Team > Groups
      summary: Dropbox groups/delete
      description: 'groups/delete


        scope: `groups.write`


        Deletes a group.

        The group is deleted immediately. However the revoking of group-owned resources may take additional time. Use the `groups/job_status/get` to determine whether this process has completed.

        Permission : Team member management.'
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n    \".tag\": \"group_id\", \n    \"group_id\": \"g:e2db7665347abcd600000000001a2b3c\"\n}"'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: OK
          headers:
            X-Dropbox-Request-Id:
              schema:
                type: integer
                example: '1234'
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
                .tag: complete
      operationId: post2TeamGroupsDelete
      x-operation-id-source: derived
  /2/team/groups/get_info:
    post:
      tags:
      - Team > Groups
      summary: Dropbox groups/get_info
      description: 'groups/get_info


        scope: `groups.read`


        Retrieves information about one or more groups. Note that the optional field `GroupFullInfo.members` is not returned for system-managed groups.

        Permission : Team Information.'
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              example: '"{\n    \".tag\": \"group_ids\", \n    \"group_ids\": [\n        \"g:e2db7665347abcd600000000001a2b3c\", \n        \"g:111111147abcd6000000000222222c\"\n    ]\n}"'
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: OK
          headers:
            X-Dropbox-Request-Id:
              schema:
                type: integer
                example: '1234'
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
              - .tag: group_info
                group_name: project launch
                group_id: g:e2db7665347abcd600000000001a2b3c
                group_management_type:
                  .tag: user_managed
                created: 1447255518000
                member_count: 5
                members:
                - profile:
                    team_member_id: dbmid:1234567
