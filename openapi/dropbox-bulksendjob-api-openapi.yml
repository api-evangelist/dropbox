openapi: 3.2.0
info:
  title: Reference Bulk Send Job API
  version: 1.0.0
servers:
- url: https://api.hellosign.com/v3
  description: https://api.hellosign.com/v3
tags:
- name: bulkSendJob
paths:
  /bulk_send_job/{bulk_send_job_id}:
    get:
      operationId: bulkSendJob_get
      summary: Get Bulk Send Job
      description: Returns the status of the BulkSendJob and its SignatureRequests specified by the `bulk_send_job_id` parameter.
      tags:
      - bulkSendJob
      parameters:
      - name: bulk_send_job_id
        in: path
        description: The id of the BulkSendJob to retrieve.
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Which page number of the BulkSendJob list to return. Defaults to `1`.
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        description: Number of objects to be returned per page. Must be between `1` and `100`. Default is 20.
        required: false
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkSendJobGetResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
  /bulk_send_job/list:
    get:
      operationId: bulkSendJob_list
      summary: List Bulk Send Jobs
      description: Returns a list of BulkSendJob that you can access.
      tags:
      - bulkSendJob
      parameters:
      - name: page
        in: query
        description: Which page number of the BulkSendJob List to return. Defaults to `1`.
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        description: Number of objects to be returned per page. Must be between `1` and `100`. Default is 20.
        required: false
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkSendJobListResponse'
        '400':
          description: failed_operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - Basic: []
